analysis_model: "openai/gpt4o"
analysis_temperature: 0.6
code_model: "openai/gpt4o"
code_temperature: 1.0
api_base: "https://thekeymaker.umass.edu/"

server_port: 8765
server_persist_dir: ".bm25_cache"

max_hypotheses: 4
max_distractors: 9000   # relevant docs + this many distractors = ~10K corpus
recall_improvement_threshold: 0.00001
analysis_max_turns: 8
bash_timeout_seconds: 30
